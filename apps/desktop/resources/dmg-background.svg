<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <!--
    macOS installer window background. Icons are placed by `dmg.contents` in
    electron-builder.yml: the app at (220, 96) and Applications at (460, 96).
    dmg-background.png and dmg-background@2x.png are screenshots of this file
    from headless Chrome at a 680x440 window, device scale factor 1 and 2.
    The step sketches mirror the macOS Gatekeeper prompt and the Security
    section of Privacy and Security settings.
  -->
  <rect width="680" height="440" fill="#f9f9fb"/>
  <g fill="none" stroke="#b9bbc6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 96H368"/>
    <path d="M358 86l10 10-10 10"/>
  </g>

  <rect x="32.25" y="188.25" width="615.5" height="223.5" rx="12" fill="#ffffff" stroke="#d9d9e0" stroke-width="0.5"/>

  <g font-family="PingFang SC, -apple-system, sans-serif" font-size="12">
    <text x="52" y="220" font-size="13" font-weight="600" fill="#1c2024">第一次打开 ChalkLee，需要在系统设置里允许一次</text>
    <text x="52" y="240" fill="#60646c">ChalkLee 是开源软件，暂未在 Apple 登记开发者身份，所以 macOS 会提示无法验证。</text>

    <!-- Step 1: the blocked-app prompt -->
    <rect x="52.25" y="256.25" width="278.5" height="83.5" rx="8" fill="#f9f9fb" stroke="#e0e1e6" stroke-width="0.5"/>
    <text x="68" y="284" font-weight="600" fill="#1c2024">未打开“ChalkLee”</text>
    <rect x="68" y="300" width="119" height="22" rx="6" fill="#e8e8ec"/>
    <text x="127.5" y="315" text-anchor="middle" fill="#1c2024">完成</text>
    <rect x="195" y="300" width="120" height="22" rx="6" fill="#3574f0"/>
    <text x="255" y="315" text-anchor="middle" fill="#ffffff">移到废纸篓</text>
    <rect x="65" y="297" width="125" height="28" rx="8" fill="none" stroke="#3574f0" stroke-width="1.5"/>

    <!-- Step 2: Privacy and Security, Security section -->
    <rect x="349.25" y="256.25" width="278.5" height="83.5" rx="8" fill="#f9f9fb" stroke="#e0e1e6" stroke-width="0.5"/>
    <text x="365" y="282" font-weight="600" fill="#60646c">安全性</text>
    <rect x="357.25" y="292.25" width="262.5" height="37.5" rx="6" fill="#ffffff" stroke="#e0e1e6" stroke-width="0.5"/>
    <text x="367" y="315" fill="#1c2024">已阻止“ChalkLee”以保护Mac。</text>
    <rect x="556" y="300" width="56" height="22" rx="6" fill="#e8e8ec"/>
    <text x="584" y="315" text-anchor="middle" fill="#1c2024">仍要打开</text>
    <rect x="553" y="297" width="62" height="28" rx="8" fill="none" stroke="#3574f0" stroke-width="1.5"/>

    <!-- Step captions -->
    <g font-weight="600" fill="#ffffff" text-anchor="middle">
      <circle cx="61" cy="362" r="9" fill="#3574f0"/>
      <text x="61" y="366">1</text>
      <circle cx="358" cy="362" r="9" fill="#3574f0"/>
      <text x="358" y="366">2</text>
    </g>
    <text x="76" y="366" fill="#1c2024">弹窗里点“完成”</text>
    <text x="76" y="384" fill="#60646c">不要点“移到废纸篓”</text>
    <text x="373" y="366" fill="#1c2024">打开 系统设置 › 隐私与安全</text>
    <text x="373" y="384" fill="#60646c">在“安全性”下点“仍要打开”</text>
  </g>
</svg>
