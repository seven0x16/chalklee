<svg xmlns="http://www.w3.org/2000/svg" width="510" height="140" viewBox="-10 0 510 140" role="img" aria-labelledby="logo-title logo-desc">
  <style>
    @font-face {
      font-family: "Poppins Embedded";
      src: url("data:font/woff2;base64,") format("woff2");
      font-style: normal;
      font-weight: 500;
      font-display: block;
    }
    @font-face {
      font-family: "Poppins Embedded";
      src: url("data:font/woff2;base64,") format("woff2");
      font-style: normal;
      font-weight: 600;
      font-display: block;
    }
  </style>
  <title id="logo-title">ChalkLee</title>
  <desc id="logo-desc">A blue C-shaped title card that hooks into a completion mark beside the ChalkLee wordmark.</desc>
  <defs>
    <linearGradient id="blue-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0875ff"/>
      <stop offset="0.55" stop-color="#0869f7"/>
      <stop offset="1" stop-color="#075cf0"/>
    </linearGradient>
    <linearGradient id="blue-fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a9bff"/>
      <stop offset="0.6" stop-color="#2879f5"/>
      <stop offset="1" stop-color="#1362ee"/>
    </linearGradient>
    <linearGradient id="blue-word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0874f9"/>
      <stop offset="1" stop-color="#0762ee"/>
    </linearGradient>
    <linearGradient id="navy-word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031d50"/>
      <stop offset="1" stop-color="#00143f"/>
    </linearGradient>
    <linearGradient id="option-line" gradientUnits="userSpaceOnUse" x1="53" y1="0" x2="91" y2="0">
      <stop offset="0" stop-color="#89a9ff"/>
      <stop offset="1" stop-color="#718df7"/>
    </linearGradient>
    <filter id="fold-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#0b4ec5" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g id="mark" aria-label="ChalkLee document mark">
    <g id="mark-frame">
      <path id="document-frame" pathLength="1" d="M 79 41.5 L 37 41.5 C 28.4 41.5 21.5 48.4 21.5 57 L 21.5 113.5 C 21.5 122.3 28.7 129.5 37.5 129.5 L 78.5 129.5 C 84.5 129.5 88.8 126.4 91.4 121.6" fill="none" stroke="url(#blue-main)" stroke-width="13" stroke-linecap="butt" stroke-linejoin="round"/>
      <path id="fold" fill="url(#blue-fold)" filter="url(#fold-shadow)" d="M78 35H80.2a2.5 2.5 0 0 1 1.77.73l22.2 22.2c1.9 1.9.6 5.1-2.1 5.1H89.4c-6.4 0-11.4-5.1-11.4-11.4Z"/>
    </g>

    <g id="choice-a" aria-label="choice A">
      <circle cx="42" cy="70.5" r="6.9" fill="url(#blue-main)"/>
      <text x="42" y="74.3" text-anchor="middle" fill="#fff" font-family="Poppins Embedded, sans-serif" font-size="10.12" font-weight="600">A</text>
    </g>
    <g id="choice-b" aria-label="choice B">
      <circle cx="42" cy="87.25" r="6.9" fill="url(#blue-main)"/>
      <text x="42" y="91.05" text-anchor="middle" fill="#fff" font-family="Poppins Embedded, sans-serif" font-size="10.12" font-weight="600">B</text>
    </g>
    <g id="choice-c" aria-label="choice C">
      <circle cx="42" cy="104" r="6.9" fill="url(#blue-main)"/>
      <text x="42" y="107.8" text-anchor="middle" fill="#fff" font-family="Poppins Embedded, sans-serif" font-size="10.12" font-weight="600">C</text>
    </g>

    <g id="choice-lines" fill="none" stroke="url(#option-line)" stroke-width="5" stroke-linecap="round">
      <path id="choice-line-a" pathLength="1" d="M56.4 70.5H88.5"/>
      <path id="choice-line-b" pathLength="1" d="M56.4 87.25H88.5"/>
      <path id="choice-line-c" pathLength="1" d="M56.4 104H78.5"/>
    </g>

    <g id="check-badge">
      <circle cx="95.5" cy="115.5" r="14.4" fill="#fff"/>
      <circle cx="95.5" cy="115.5" r="12.4" fill="url(#blue-main)"/>
    </g>
    <path id="check-stroke" pathLength="1" d="M89.4 115.2l4.4 4.5 8.1-9" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="sparkles" transform="translate(-9.8 12.2) scale(0.78)">
      <path id="spark-large" transform="translate(6.8 4)" fill="url(#blue-main)" d="M17 10.5c1.7 8.2 4 10.8 13 12.8-9 2-11.3 4.5-13 13-1.8-8.5-4.2-11-13-13 8.8-2 11.2-4.6 13-12.8Z"/>
      <path id="spark-small" transform="translate(-0.6 2.8)" fill="url(#blue-main)" d="M37 3.5c.8 4.2 2.1 5.5 6.2 6.5-4.1 1-5.4 2.3-6.2 6.4-.9-4.1-2.1-5.4-6.2-6.4 4.1-1 5.3-2.3 6.2-6.5Z"/>
      <path id="spark-purple" fill="#9762ef" d="M47 17.2c1 4.9 2.5 6.4 7.4 7.6-4.9 1.1-6.4 2.6-7.4 7.4-1.1-4.8-2.6-6.3-7.4-7.4 4.8-1.2 6.3-2.7 7.4-7.6Z"/>
    </g>
  </g>

  <g id="wordmark" aria-label="ChalkLee" transform="translate(123 86.8) scale(1.25) translate(-123 -78)">
    <g id="word-chalk" fill="url(#navy-word)" font-family="Poppins Embedded, sans-serif" font-size="64" font-weight="500">
      <text id="letter-c" x="0" y="100" transform="matrix(0.93187 0 0 1.00687 123.08859 -2.69149)">C</text>
      <text id="letter-h" x="0" y="100" transform="matrix(0.88739 0 0 0.92249 167.39338 5.75129)">h</text>
      <text id="letter-a" x="0" y="100" transform="matrix(0.85854 0 0 0.91967 203.08815 6.11337)">a</text>
      <text id="letter-l" x="0" y="100" transform="matrix(1.18840 0 0 0.92249 237.24643 5.75129)">l</text>
      <text id="letter-k" x="0" y="100" transform="matrix(0.94260 0 0 0.92249 252.13531 5.75129)">k</text>
    </g>
    <g id="word-lee" fill="url(#blue-word)">
      <path id="letter-lee-0" d="M189 92H424V0H75V695H189Z" transform="translate(288 98) scale(.064 -.064)"/>
      <path id="letter-lee-1" d="M576 233H155Q160 167 204.0 127.0Q248 87 312 87Q404 87 442 164H565Q540 88 474.5 39.5Q409 -9 312 -9Q233 -9 170.5 26.5Q108 62 72.5 126.5Q37 191 37 276Q37 361 71.5 425.5Q106 490 168.5 525.0Q231 560 312 560Q390 560 451.0 526.0Q512 492 546.0 430.5Q580 369 580 289Q580 258 576 233ZM461 325Q460 388 416.0 426.0Q372 464 307 464Q248 464 206.0 426.5Q164 389 156 325Z" transform="translate(316.416 98) scale(.064 -.064)"/>
      <path id="letter-lee-2" d="M576 233H155Q160 167 204.0 127.0Q248 87 312 87Q404 87 442 164H565Q540 88 474.5 39.5Q409 -9 312 -9Q233 -9 170.5 26.5Q108 62 72.5 126.5Q37 191 37 276Q37 361 71.5 425.5Q106 490 168.5 525.0Q231 560 312 560Q390 560 451.0 526.0Q512 492 546.0 430.5Q580 369 580 289Q580 258 576 233ZM461 325Q460 388 416.0 426.0Q372 464 307 464Q248 464 206.0 426.5Q164 389 156 325Z" transform="translate(355.904 98) scale(.064 -.064)"/>
    </g>
  </g>

</svg>
